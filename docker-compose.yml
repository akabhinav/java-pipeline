version: '3.8'

################################################################################
# Enterprise Data Pipeline Platform - Local Testing Environment
#
# This Docker Compose setup provides a complete local testing environment with:
# - Apache Kafka (with Zookeeper)
# - MinIO (S3-compatible storage)
# - PostgreSQL (relational database)
# - pgAdmin (database management UI)
# - Kafka UI (Kafka management)
#
# Usage:
#   docker-compose up -d          # Start all services
#   docker-compose down           # Stop all services
#   docker-compose logs -f        # View logs
#   docker-compose ps             # Check status
################################################################################

services:
  # ===========================================================================
  # Apache Zookeeper - Required for Kafka
  # ===========================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: pipeline-zookeeper
    hostname: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    networks:
      - pipeline-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # Apache Kafka - Streaming Platform
  # ===========================================================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: pipeline-kafka
    hostname: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - pipeline-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ===========================================================================
  # Kafka UI - Web interface for Kafka management
  # ===========================================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: pipeline-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - pipeline-network

  # ===========================================================================
  # MinIO - S3-compatible Object Storage
  # ===========================================================================
  minio:
    image: minio/minio:latest
    container_name: pipeline-minio
    hostname: minio
    ports:
      - "9000:9000"      # API
      - "9001:9001"      # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DOMAIN: minio
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - pipeline-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # MinIO Client - Initialize buckets and upload sample data
  # ===========================================================================
  minio-init:
    image: minio/mc:latest
    container_name: pipeline-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO to be ready...';
      sleep 5;

      echo 'Configuring MinIO client...';
      mc alias set myminio http://minio:9000 minioadmin minioadmin;

      echo 'Creating buckets...';
      mc mb myminio/banking-data --ignore-existing;
      mc mb myminio/pipeline-output --ignore-existing;
      mc mb myminio/archive --ignore-existing;

      echo 'Setting bucket policies to public...';
      mc anonymous set download myminio/banking-data;
      mc anonymous set download myminio/pipeline-output;

      echo 'MinIO initialization complete!';
      echo 'Buckets created: banking-data, pipeline-output, archive';
      "
    networks:
      - pipeline-network

  # ===========================================================================
  # PostgreSQL - Relational Database
  # ===========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: pipeline-postgres
    hostname: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline123
      POSTGRES_DB: banking
      POSTGRES_INITDB_ARGS: "-E UTF8"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - pipeline-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline -d banking"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # pgAdmin - PostgreSQL Management UI
  # ===========================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pipeline-pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pipeline.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json
    networks:
      - pipeline-network

# =============================================================================
# Networks
# =============================================================================
networks:
  pipeline-network:
    driver: bridge
    name: pipeline-network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  zookeeper-data:
    name: pipeline-zookeeper-data
  zookeeper-logs:
    name: pipeline-zookeeper-logs
  kafka-data:
    name: pipeline-kafka-data
  minio-data:
    name: pipeline-minio-data
  postgres-data:
    name: pipeline-postgres-data
  pgadmin-data:
    name: pipeline-pgadmin-data
